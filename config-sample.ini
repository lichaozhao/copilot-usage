[es]
es_username=<your es user name>
es_password=<your es password>
es_host=<your es url:9200>

[azure_storage]
storage_account_name=<your storage account name>
storage_account_key=<your storage account key>
container_name=<your container name>

[aad]
# Azure Active Directory configuration
tenant_id=<your azure ad tenant id>
client_id=<your azure ad client id>
client_secret=<your azure ad client secret>
# Enable AAD authentication (true/false)
enable_aad_auth=false
# Fallback to username list when AAD fails (true/false)
fallback_to_userlist=true
# AAD authority URL (optional, defaults to public cloud)
authority=https://login.microsoftonline.com/{tenant_id}
# Allowed AAD groups (comma-separated, optional)
allowed_groups=